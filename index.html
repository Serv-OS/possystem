<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="manifest" href="/manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Serv OS">
    <!-- Per-mode install manifest: when you "Add to Home Screen" from ?mode=manager (or ops/kds/clock/…)
         the installed app must launch in THAT mode, not the static start_url. We rewrite the manifest
         (distinct id/name/start_url/orientation per mode) at load so each saved icon opens its surface. -->
    <script>
      (function () {
        try {
          var mode = (new URLSearchParams(location.search).get('mode') || 'pos').toLowerCase();
          if (mode === 'backoffice') mode = 'office';
          var M = {
            pos: ['Serv OS POS', 'landscape'], mpos: ['Serv OS MPOS', 'portrait'],
            kds: ['Serv OS KDS', 'landscape'], bar: ['Serv OS Bar', 'landscape'],
            tables: ['Serv OS Tables', 'landscape'], kiosk: ['Serv OS Kiosk', 'portrait'],
            clock: ['Serv OS Clock', 'portrait'], orders: ['Serv OS Orders', 'landscape'],
            menuboard: ['Serv OS Menu', 'landscape'], ops: ['Serv OS Ops', 'portrait'],
            waitlist: ['Serv OS Host', 'portrait'], manager: ['Serv OS Manager', 'portrait'],
            owner: ['Serv OS Owner', 'portrait'], office: ['Serv OS Office', 'any']
          };
          var cfg = M[mode] || M.pos;
          var startUrl = '/?mode=' + mode;
          var manifest = {
            name: cfg[0], short_name: cfg[0].replace('Serv OS ', '') || 'Serv OS',
            description: 'The operating system for hospitality',
            id: startUrl, start_url: startUrl, scope: '/', display: 'standalone', orientation: cfg[1],
            background_color: '#0f1117', theme_color: '#15C36B', categories: ['business', 'productivity'],
            icons: [72, 96, 128, 144, 152, 192, 384, 512].map(function (s) {
              return { src: '/icons/icon-' + s + 'x' + s + '.png', sizes: s + 'x' + s, type: 'image/png', purpose: (s === 192 || s === 512) ? 'any maskable' : 'any' };
            })
          };
          var href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
          var link = document.querySelector('link[rel="manifest"]');
          if (link) link.href = href;
          var title = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (title) title.setAttribute('content', cfg[0]);
          document.title = cfg[0];
        } catch (e) { /* keep the static manifest fallback */ }
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#15C36B">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serv OS</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- ServOS visual system fonts (staff surfaces): Space Grotesk (UI), JetBrains Mono (numbers), Syne (S monogram) -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- Customer menu (storefront) body font — pairs with Space Grotesk for display -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

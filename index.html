<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Serv OS">
    <!-- Per-mode install manifest: "Add to Home Screen" from ?mode=manager (or ops/kds/clock/…) must
         launch THAT mode. There is deliberately NO static <link rel="manifest"> — iOS Safari latches
         the FIRST manifest link it parses (v5.5.721 swapped the href after the fact and iPhones still
         installed the POS), so the script below synchronously CREATES the link pointing at the real
         per-mode file (public/manifest-<mode>.json — distinct id/start_url/name/orientation). -->
    <script>
      (function () {
        var href = '/manifest.json';
        try {
          var mode = (new URLSearchParams(location.search).get('mode') || 'pos').toLowerCase();
          if (mode === 'backoffice') mode = 'office';
          var M = {
            pos: 'Serv OS POS', mpos: 'Serv OS MPOS', kds: 'Serv OS KDS', bar: 'Serv OS Bar',
            tables: 'Serv OS Tables', kiosk: 'Serv OS Kiosk', clock: 'Serv OS Clock',
            orders: 'Serv OS Orders', menuboard: 'Serv OS Menu', ops: 'Serv OS Ops',
            waitlist: 'Serv OS Host', manager: 'Serv OS Manager', owner: 'Serv OS Owner',
            office: 'Serv OS Office'
          };
          if (!M[mode]) mode = 'pos';
          href = '/manifest-' + mode + '.json';
          var title = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (title) title.setAttribute('content', M[mode]);
          document.title = M[mode];
        } catch (e) { /* fall through to the default manifest */ }
        var link = document.createElement('link');
        link.rel = 'manifest'; link.href = href;
        document.head.appendChild(link);
      })();
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <meta name="theme-color" content="#15C36B">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serv OS</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- ServOS visual system fonts (staff surfaces): Space Grotesk (UI), JetBrains Mono (numbers), Syne (S monogram) -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <!-- Customer menu (storefront) body font — pairs with Space Grotesk for display -->
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Group venue picker (/order, /cater) — design-handoff typeface -->
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

// Serv OS MPOS — mobile point-of-sale for a phone (tableside ordering).
//
// A standalone WebView app (own applicationId, own CI, own update channel) following the
// same "one module per device app" pattern as :app (POS) and :menuboard (Fire TV). It loads
// the existing web POS surface at ?mode=mpos.
//
// Card payments use the surface's existing flows (assigned hardware reader, or simulated in a
// browser). Contactless "Tap to Pay on phone" is NOT on Android here — Ryft (the chosen
// processor) has no Android SoftPOS — so Tap to Pay is being built on iOS instead. The web
// Tap to Pay bridge (window.RposTapToPay / src/lib/tapToPay.js) is left in place, dormant on
// Android, ready for the native iOS app to implement.
plugins {
    id 'com.android.application'
}

android {
    namespace 'co.posup.rpos.mpos'
    compileSdk 34

    defaultConfig {
        applicationId "co.posup.rpos.mpos"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

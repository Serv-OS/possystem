plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'co.posup.rpos'
    compileSdk 34

    defaultConfig {
        applicationId "co.posup.rpos"
        // Stripe Terminal SDK requires minSdk 26 (Android 8.0) for the BBPOS Bluetooth reader.
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        // Stripe Terminal SDK 3.x requires Java 17.
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        // Stripe Terminal pulls multiple META-INF entries that conflict by default.
        resources {
            excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/INDEX.LIST',
                'META-INF/io.netty.versions.properties',
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Kotlin coroutines (used by StripeTerminalBridge for non-blocking IO)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Stripe Terminal Android SDK — core + BBPOS module for the M2 Bluetooth reader.
    // 3.10.1 is the latest stable as of build time.
    implementation 'com.stripe:stripeterminal-core:3.10.1'
    implementation 'com.stripe:stripeterminal-bbpos:3.10.1'
}

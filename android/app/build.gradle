plugins {
    id 'com.android.application'
}

android {
    namespace 'co.posup.rpos'
    compileSdk 34

    defaultConfig {
        applicationId "co.posup.rpos"
        // v5.5.58: Stripe Terminal SDK removed (WiFi-only payments, REST flow).
        // minSdk could be lowered now, but keeping 26 to match prior installs.
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

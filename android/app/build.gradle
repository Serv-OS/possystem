plugins {
    id 'com.android.application'
}

android {
    namespace 'co.posup.rpos'
    compileSdk 34

    defaultConfig {
        applicationId "co.posup.rpos"
        // v5.5.58: Stripe Terminal SDK removed (WiFi-only payments, REST flow).
        // minSdk could be lowered now, but keeping 26 to match prior installs.
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.6"
    }

    // BuildConfig.SURFACE drives which web surface MainActivity loads (AGP 8 needs this opt-in).
    buildFeatures {
        buildConfig true
    }

    // One codebase, multiple device "surfaces". POS keeps co.posup.rpos so existing
    // tills upgrade in place; menuboard is a side-by-side install for a TV / Fire-TV stick.
    flavorDimensions "surface"
    productFlavors {
        pos {
            dimension "surface"
            // applicationId inherited from defaultConfig (co.posup.rpos) — DO NOT change.
            buildConfigField "String", "SURFACE", '"pos"'
        }
        menuboard {
            dimension "surface"
            applicationId "co.posup.rpos.menuboard"
            versionNameSuffix "-mb"
            buildConfigField "String", "SURFACE", '"menuboard"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
rootProject.name = "RestaurantOS"
include ':app'
// Each device "app" is its own module (own applicationId, own CI workflow, own
// update channel). ':app' = POS. Add new surfaces (menuboard, kds, …) the same way.
include ':menuboard'
include ':mpos'
// :paxpay = card payments on a PAX A920 Pro via the Ryft/STS "G8" stack. The only NATIVE
// module (no WebView) — the RPOS SPA does not run on that hardware's Chrome 80 WebView.
include ':paxpay'

// v5.8.79: the shared WebView shell and the eight device apps built on it (android/webshell).
include ':webshell'
include ':kds'
include ':kiosk'
include ':owner'
include ':manager'
include ':staff'
include ':clock'
include ':waitlist'
include ':bookings'

// Serv OS Menu — the digital menu-board app (Fire TV / Android-TV), self-updating.
// A standalone module so it builds, versions, signs and updates entirely independently of
// the POS app (':app'). New device apps follow this same shape.
//
// SIGNING: in-app auto-update (UpdateChecker.java → app-releases/latest-menuboard.json) only
// installs in place when every build is signed with the SAME key. CI signs RELEASE builds with
// one shared keystore from GitHub secrets (ANDROID_KEYSTORE_*). If those aren't present it falls
// back to the debug key so the build still succeeds — but such a build won't auto-update a
// key-signed install.
plugins {
    id 'com.android.application'
}

def ksPath = System.getenv('ANDROID_KEYSTORE_FILE')
def hasKeystore = ksPath != null && new File(ksPath).exists()

android {
    namespace 'co.posup.rpos.menuboard'
    compileSdk 34

    defaultConfig {
        applicationId "co.posup.rpos.menuboard"
        minSdk 26          // Fire OS 7+ / Android 8+
        targetSdk 34
        versionCode 2      // bump every release; UpdateChecker compares this to latest-menuboard.json
        versionName "1.1"
    }

    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile file(ksPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            signingConfig hasKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

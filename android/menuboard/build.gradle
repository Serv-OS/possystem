// Serv OS Menu — the digital menu-board app (Fire TV / Android-TV).
// A standalone module so it builds, versions, signs and updates entirely
// independently of the POS app (':app'). New device apps follow this same shape.
plugins {
    id 'com.android.application'
}

android {
    namespace 'co.posup.rpos.menuboard'
    compileSdk 34

    defaultConfig {
        applicationId "co.posup.rpos.menuboard"
        minSdk 26          // Fire OS 7+ / Android 8+
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

# XcodeGen project spec for the ServOS iOS shells (POS + KDS + Time Clock + Waitlist + Bookings).
# Run `xcodegen generate` in this directory to produce "ServOS POS.xcodeproj".
# Tested against XcodeGen 2.46.0 syntax. Nothing here is committed to a pbxproj
# by hand; the .xcodeproj is a build artifact and should stay out of git.
#
# ONE source tree, MULTIPLE app targets:
#   - Every target compiles the same Swift files in ServOSPOS/.
#   - App-specific behaviour comes from that target's generated Info.plist:
#       RPOSAppURL       (String) — the web app URL the shell hosts
#       RPOSAllowsCamera (Bool)   — grant camera to our origin (POS QR scan);
#                                   targets setting true must ALSO declare
#                                   NSCameraUsageDescription. Absent/false =
#                                   camera denied and no permission string.
#   - Each target has its OWN asset catalog (AppIcon + LaunchBackground).
# To add another app: copy the KDS target + scheme stanzas, change bundle id,
# display name, RPOSAppURL and the asset catalog path. See README.md.

name: ServOS POS

options:
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  ServOS POS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: ServOSPOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.posup.rpos.pos
        PRODUCT_NAME: ServOS POS
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
        # Signing stays Automatic. The team is chosen in Xcode by the owner.
        # After first signing, record the 10-character team id here as
        # DEVELOPMENT_TEAM so `xcodegen generate` does not wipe the choice.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LYQ8K25MGZ
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: ServOSPOS/Info.plist
      properties:
        CFBundleDisplayName: ServOS POS
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Per-app keys read by Config.swift (shared source tree).
        RPOSAppURL: "https://possystem-liard.vercel.app/?mode=pos"
        RPOSAllowsCamera: true
        # Camera is used by the web app's QR scanning (getUserMedia).
        # Microphone is deliberately NOT requested; the shell denies it.
        NSCameraUsageDescription: "ServOS POS uses the camera to scan QR codes for table ordering, loyalty and gift cards."
        # App Transport Security stays at the secure default (https only).
        # The POS URL is https; no arbitrary-loads exception is added.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # iPad: all orientations. iPhone: portrait only (big-screen app, but it
        # must run without crashing on iPhone for TestFlight review).
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ServOS KDS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Same Swift files as POS; the POS asset catalog and the POS-generated
      # Info.plist are excluded so KDS ships its own.
      - path: ServOSPOS
        excludes:
          - "Assets.xcassets"
          - "Info.plist"
      - path: ServOSKDS/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.posup.rpos.kds
        PRODUCT_NAME: ServOS KDS
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LYQ8K25MGZ
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: ServOSKDS/Info.plist
      properties:
        CFBundleDisplayName: ServOS KDS
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Per-app keys read by Config.swift (shared source tree).
        # v5.7.35 pins the KDS surface from the mode param.
        RPOSAppURL: "https://possystem-liard.vercel.app/?mode=kds"
        # KDS never scans: camera denied in the WebView permission handler and
        # NO NSCameraUsageDescription is declared (no camera permission at all).
        RPOSAllowsCamera: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Orientations identical to POS: iPad all, iPhone portrait only.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ServOS Time Clock:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Same Swift files as POS; the POS asset catalog and the POS-generated
      # Info.plist are excluded so KDS ships its own.
      - path: ServOSPOS
        excludes:
          - "Assets.xcassets"
          - "Info.plist"
      - path: ServOSClock/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.posup.rpos.clock
        PRODUCT_NAME: ServOS Time Clock
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LYQ8K25MGZ
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: ServOSClock/Info.plist
      properties:
        CFBundleDisplayName: ServOS Time Clock
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Per-app keys read by Config.swift (shared source tree).
        # ?mode=clock is a native URL mode (TimeClockSurface).
        RPOSAppURL: "https://possystem-liard.vercel.app/?mode=clock"
        # The Time Clock is a PIN pad: camera denied, no permission declared.
        RPOSAllowsCamera: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Orientations identical to POS: iPad all, iPhone portrait only.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ServOS Waitlist:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Same Swift files as POS; the POS asset catalog and the POS-generated
      # Info.plist are excluded so KDS ships its own.
      - path: ServOSPOS
        excludes:
          - "Assets.xcassets"
          - "Info.plist"
      - path: ServOSWaitlist/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.posup.rpos.waitlist
        PRODUCT_NAME: ServOS Waitlist
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LYQ8K25MGZ
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: ServOSWaitlist/Info.plist
      properties:
        CFBundleDisplayName: ServOS Waitlist
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Per-app keys read by Config.swift (shared source tree).
        # ?mode=waitlist is a native URL mode (WaitlistSurface, Tables Ready).
        RPOSAppURL: "https://possystem-liard.vercel.app/?mode=waitlist"
        # The waitlist is a host stand: camera denied, no permission declared.
        RPOSAllowsCamera: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Orientations identical to POS: iPad all, iPhone portrait only.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  ServOS Bookings:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Same Swift files as POS; the POS asset catalog and the POS-generated
      # Info.plist are excluded so KDS ships its own.
      - path: ServOSPOS
        excludes:
          - "Assets.xcassets"
          - "Info.plist"
      - path: ServOSBookings/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.posup.rpos.bookings
        PRODUCT_NAME: ServOS Bookings
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LYQ8K25MGZ
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: ServOSBookings/Info.plist
      properties:
        CFBundleDisplayName: ServOS Bookings
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Per-app keys read by Config.swift (shared source tree).
        # ?mode=bookings is a native URL mode (BookingsSurface, the host stand:
        # diary, floor, pre-orders, widget controls).
        RPOSAppURL: "https://possystem-liard.vercel.app/?mode=bookings"
        # The bookings host stand needs no camera: denied, no permission declared.
        RPOSAllowsCamera: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Orientations identical to POS: iPad all, iPhone portrait only.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight


  ServOS Manager:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Same Swift files as POS; the POS asset catalog and the POS-generated
      # Info.plist are excluded so Manager ships its own.
      - path: ServOSPOS
        excludes:
          - "Assets.xcassets"
          - "Info.plist"
      - path: ServOSManager/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.posup.rpos.manager
        PRODUCT_NAME: ServOS Manager
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LYQ8K25MGZ
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: ServOSManager/Info.plist
      properties:
        CFBundleDisplayName: ServOS Manager
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Per-app keys read by Config.swift (shared source tree).
        # ?mode=manager is a native URL mode (ManagerSurface: Home, Reports,
        # Team, Ops, Kitchen, gated by pairing then a staff PIN).
        RPOSAppURL: "https://possystem-liard.vercel.app/?mode=manager"
        # Manager reads, it never scans: camera denied, no permission declared.
        RPOSAllowsCamera: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # Orientations identical to POS: iPad all, iPhone portrait only. Manager
        # is a phone app with a floating bottom tab bar, so portrait is the case
        # that matters.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight


  ServOS Owner:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Same Swift files as POS; the POS asset catalog and the POS-generated
      # Info.plist are excluded so Owner ships its own.
      - path: ServOSPOS
        excludes:
          - "Assets.xcassets"
          - "Info.plist"
      - path: ServOSOwner/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.posup.rpos.owner
        PRODUCT_NAME: ServOS Owner
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LYQ8K25MGZ
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: ServOSOwner/Info.plist
      properties:
        CFBundleDisplayName: ServOS Owner
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Per-app keys read by Config.swift (shared source tree).
        # ?mode=owner is a native URL mode (OwnerSurface): a read-only rollup
        # across every venue the signed-in owner can reach. Unlike every other
        # app here it does NOT pair, it signs in with back office credentials,
        # and each iOS app has its own cookie store, so that session is isolated
        # from the tills. That is exactly what the one-session-per-browser rule
        # wants: an owner signing in here can never clobber a till's session.
        RPOSAppURL: "https://possystem-liard.vercel.app/?mode=owner"
        # Read-only reporting, nothing to scan: camera denied.
        RPOSAllowsCamera: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # A phone app first, so portrait is the case that matters; iPad gets all
        # four for parity with the rest of the family.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight


  ServOS Staff:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      # Same Swift files as POS; the POS asset catalog and the POS-generated
      # Info.plist are excluded so Staff ships its own.
      - path: ServOSPOS
        excludes:
          - "Assets.xcassets"
          - "Info.plist"
      - path: ServOSStaff/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.posup.rpos.staff
        PRODUCT_NAME: ServOS Staff
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LYQ8K25MGZ
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    info:
      path: ServOSStaff/Info.plist
      properties:
        CFBundleDisplayName: ServOS Staff
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        # Per-app keys read by Config.swift (shared source tree).
        # ?mode=staff is a native URL mode (StaffSurface): the staff member's own
        # phone. Shifts, News, Timesheets, Me. It signs in with an email and
        # password on a SEPARATE Supabase client (rpos-staff-auth), and every
        # read goes through the staff-portal edge fn, which serves only their own
        # data. On iOS each app has its own cookie store, so a staff member
        # signing in here can never disturb a till or the back office.
        RPOSAppURL: "https://possystem-liard.vercel.app/?mode=staff"
        # Nothing to scan: camera denied.
        RPOSAllowsCamera: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        # A personal phone app, so portrait is the case that matters.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  ServOS POS:
    build:
      targets:
        ServOS POS: all
    run:
      config: Debug
    archive:
      config: Release
  ServOS KDS:
    build:
      targets:
        ServOS KDS: all
    run:
      config: Debug
    archive:
      config: Release
  ServOS Time Clock:
    build:
      targets:
        ServOS Time Clock: all
    run:
      config: Debug
    archive:
      config: Release
  ServOS Waitlist:
    build:
      targets:
        ServOS Waitlist: all
    run:
      config: Debug
    archive:
      config: Release
  ServOS Bookings:
    build:
      targets:
        ServOS Bookings: all
    run:
      config: Debug
    archive:
      config: Release
  ServOS Manager:
    build:
      targets:
        ServOS Manager: all
    run:
      config: Debug
    archive:
      config: Release
  ServOS Owner:
    build:
      targets:

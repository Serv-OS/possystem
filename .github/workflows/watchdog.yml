name: Watchdog
# Something watches the venues, so a customer does not have to.
#
# Peter is 8 hours behind the UK, so venues trade while he sleeps. Until now
# every fault was found by a person standing at a counter: Apple Pay dead on the
# checkout, menu saves failing for five months, a kiosk card payment stranded,
# 72 tickets that never reached paper.
#
# IT RUNS HERE, ON GITHUB, ON PURPOSE. The 22 Sep outage took the database down
# for 45 minutes AND took its own scheduled jobs with it (the two sweeps that
# rescue stranded card payments are database jobs; both died at 01:35). Anything
# watching from inside would have been just as dead. From here it can still say
# "the database is not answering", which is the most important thing it can say.
#
# HOW IT REACHES A HUMAN
#   1. It opens a GitHub issue labelled `watchdog`, which emails whoever watches
#      this repo. That works today with no extra setup.
#   2. A failing run shows red in Actions, which GitHub also emails.
#   3. SMS, IF these repo secrets exist: TWILIO_ACCOUNT_SID, TWILIO_AUTH_TOKEN,
#      TWILIO_FROM_NUMBER (or TWILIO_FROM) and ALERT_TO, the phone to text in
#      +44.../+1... form. Without them everything else still works. Run this
#      workflow by hand with "Send one test text" ticked to prove the path
#      before trusting it overnight.
#
# The issue closes itself when the fault clears, so the open list is always what
# is wrong right now.
#
# IT HOLDS NO KEYS. GitHub stores WATCHDOG_TOKEN, a random string that can only
# ask `watchdog-status` for four counts, never a service-role key that could
# read and rewrite every venue.
on:
  schedule:
    # Every 5 minutes, BUT GitHub honours very few of these: on 22 Sep 2026 it
    # ran this workflow ONCE in the first three hours. So the schedule is only a
    # way of starting a watcher. The run itself then keeps looking every 5
    # minutes for the best part of an hour (--watch below), which is what makes
    # overnight cover real rather than theoretical.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_sms:
        description: 'Send one test text to ALERT_TO and stop. Proves the alarm reaches a phone.'
        type: boolean
        default: false

# Exactly one watcher alive. A newly triggered run REPLACES the one in progress,
# which both stops two watchers double-reporting and means every trigger buys an
# immediate look rather than queueing behind a 50 minute run.
concurrency:
  group: watchdog
  cancel-in-progress: true

permissions:
  issues: write        # open, comment on and close its own issues
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Look at the venues
        env:
          SUPABASE_URL: https://tbetcegmszzotrwdtqhi.supabase.co
          # NOT a service-role key. This token can do exactly one thing: ask the
          # `watchdog-status` edge function for four counts. It cannot read an
          # order, a customer or a penny, and it cannot write anything at all.
          WATCHDOG_TOKEN: ${{ secrets.WATCHDOG_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_FROM_NUMBER: ${{ secrets.TWILIO_FROM_NUMBER }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: node scripts/watchdog/run.mjs ${{ github.event.inputs.test_sms == 'true' && '--test-sms' || '--watch' }}

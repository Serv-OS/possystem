name: Build Android APK
# POS app (co.posup.rpos) — self-updating till app. Signed RELEASE builds use the one shared
# keystore from secrets so the in-app auto-updater installs updates in place. Set repo secrets:
# ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# (+ SUPABASE_SERVICE_KEY to auto-publish app.apk + latest.json). Without them the build falls
# back to the debug key (builds fine, but won't auto-update a key-signed install).
#
# NOTE: publishing a higher versionCode prompts EVERY installed POS to update. Tills currently
# on the debug build must be reinstalled once onto the first fixed-key build (signatures differ);
# until then they'll see a failing update prompt. Migrate live tills deliberately.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android/app/**'
      - 'android/settings.gradle'
      - 'android/build.gradle'
      - 'android/release/latest.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: chmod +x android/gradlew

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/servos-release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/servos-release.p12" >> "$GITHUB_ENV"

      - name: Build POS release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: RestaurantOS-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90

      # Auto-publish (no-op until SUPABASE_SERVICE_KEY is set): push the signed APK + the
      # version manifest so every till sees the new build and self-updates.
      - name: Publish POS APK + manifest to Supabase (if configured)
        if: ${{ env.SUPABASE_SERVICE_KEY != '' }}
        run: |
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          curl -fsS --http1.1 -X POST \
            "https://tbetcegmszzotrwdtqhi.supabase.co/storage/v1/object/app-releases/app.apk" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK"
          curl -fsS --http1.1 -X POST \
            "https://tbetcegmszzotrwdtqhi.supabase.co/storage/v1/object/app-releases/latest.json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/json" \
            --data-binary @android/release/latest.json

name: Build device apps
# v5.8.79 (Peter, 15 Sep 2026): the eight Android device apps on the shared :webshell
# (android/webshell): KDS, Kiosk, Owner, Manager, Staff, Time Clock, Waitlist, Bookings host stand.
# One job per app, in parallel. Any change to the shell rebuilds all eight (they share it).
#
# Signed RELEASE builds use the one shared keystore from secrets (ANDROID_KEYSTORE_*), so the in-app
# updater installs updates in place. With SUPABASE_SERVICE_KEY set, each job also publishes
# app-releases/<app>.apk + latest-<app>.json; without it, the APKs are the run's artifacts.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android/webshell/**'
      - 'android/kds/**'
      - 'android/kiosk/**'
      - 'android/owner/**'
      - 'android/manager/**'
      - 'android/staff/**'
      - 'android/clock/**'
      - 'android/waitlist/**'
      - 'android/bookings/**'
      - 'android/settings.gradle'
      - 'android/build.gradle'
      - 'android/release/latest-kds.json'
      - 'android/release/latest-kiosk.json'
      - 'android/release/latest-owner.json'
      - 'android/release/latest-manager.json'
      - 'android/release/latest-staff.json'
      - 'android/release/latest-clock.json'
      - 'android/release/latest-waitlist.json'
      - 'android/release/latest-bookings.json'
      - '.github/workflows/build-device-apps.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [ kds, kiosk, owner, manager, staff, clock, waitlist, bookings ]
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      # 15 Sep 2026: setup-android@v3 installs the SDK "tools" package by default, which the runner's
      # sdkmanager no longer has ("Failed to find package 'tools'", exit 1), so every Android build
      # failed before gradle ran. Ask only for what the builds use.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - run: chmod +x android/gradlew

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/servos-release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/servos-release.p12" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.app }} release APK
        working-directory: android
        run: ./gradlew :${{ matrix.app }}:assembleRelease --no-daemon --stacktrace

      - name: Upload ${{ matrix.app }} APK
        uses: actions/upload-artifact@v4
        with:
          name: ServOS-${{ matrix.app }}-APK
          path: android/${{ matrix.app }}/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Publish ${{ matrix.app }} APK + manifest to Supabase (if configured)
        if: ${{ env.SUPABASE_SERVICE_KEY != '' }}
        run: |
          APK=$(find android/${{ matrix.app }}/build/outputs/apk/release -name '*.apk' | head -1)
          curl -fsS --http1.1 -H "Expect:" -X POST \
            "https://tbetcegmszzotrwdtqhi.supabase.co/storage/v1/object/app-releases/${{ matrix.app }}.apk" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK"
          curl -fsS --http1.1 -H "Expect:" -X POST \
            "https://tbetcegmszzotrwdtqhi.supabase.co/storage/v1/object/app-releases/latest-${{ matrix.app }}.json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/json" \
            --data-binary @android/release/latest-${{ matrix.app }}.json

name: Build Menu Board APK (Fire TV)
# Standalone build for the digital menu board (co.posup.rpos.menuboard).
# Independent of the POS build (build-apk.yml). New device apps get their own
# module + their own workflow like this.
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android/menuboard/**'
      - 'android/settings.gradle'
      - '.github/workflows/build-menuboard.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: chmod +x android/gradlew
      - name: Build Menu Board APK
        working-directory: android
        run: ./gradlew :menuboard:assembleDebug --no-daemon --stacktrace
      - name: Upload Menu Board APK (Fire TV)
        uses: actions/upload-artifact@v4
        with:
          name: ServOS-MenuBoard-FireTV-APK
          path: android/menuboard/build/outputs/apk/debug/menuboard-debug.apk
          retention-days: 90
      # Optional no-PC install: publish to a public URL the Fire-TV "Downloader" app can fetch.
      # No-op until the SUPABASE_SERVICE_KEY repo secret is set. Lands at:
      #   https://tbetcegmszzotrwdtqhi.supabase.co/storage/v1/object/public/app-releases/menuboard.apk
      - name: Publish Menu Board APK to Supabase (if configured)
        if: ${{ env.SUPABASE_SERVICE_KEY != '' }}
        run: |
          curl -fsS -X POST \
            "https://tbetcegmszzotrwdtqhi.supabase.co/storage/v1/object/app-releases/menuboard.apk" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @android/menuboard/build/outputs/apk/debug/menuboard-debug.apk

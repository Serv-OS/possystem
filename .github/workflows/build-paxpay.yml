name: Build PaxPay APK
# Standalone build for PaxPay (co.posup.rpos.paxpay) — the native card-payment app that runs ON
# a PAX A920 Pro payment terminal and drives Ryft/STS "G8" transactions. Independent of POS
# (build-apk.yml), MPOS (build-mpos.yml) and Menu Board (build-menuboard.yml), per
# android/NEW_APP_CHECKLIST.md.
#
# ⚠ MILESTONE 1: the G8:Cloud HTTP call is STUBBED (blocked on Ryft supplying the API spec), so
# builds from this workflow CANNOT CHARGE A CARD. They show an amber "SIMULATED BUILD" banner.
# Do not publish these to real terminals as if they were a working payment app.
#
# Signed RELEASE builds use one fixed keystore from secrets so the in-app auto-updater can
# install updates in place. Set repo secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (+ SUPABASE_SERVICE_KEY to auto-publish). Without them
# the build falls back to the debug key (builds fine, but won't auto-update a key-signed install).
on:
  push:
    branches: [ main, develop ]
    paths:
      - 'android/paxpay/**'
      - 'android/settings.gradle'
      - 'android/build.gradle'
      - 'android/release/latest-paxpay.json'
      - '.github/workflows/build-paxpay.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - run: chmod +x android/gradlew

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/servos-release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/servos-release.p12" >> "$GITHUB_ENV"

      - name: Build PaxPay release APK
        working-directory: android
        run: ./gradlew :paxpay:assembleRelease --no-daemon --stacktrace

      - name: Upload PaxPay APK
        uses: actions/upload-artifact@v4
        with:
          name: ServOS-PaxPay-APK
          path: android/paxpay/build/outputs/apk/release/*.apk
          retention-days: 90

      # Auto-publish (no-op until SUPABASE_SERVICE_KEY is set): push the signed APK + the
      # version manifest so every running app sees the new build and self-updates.
      - name: Publish PaxPay APK + manifest to Supabase (if configured)
        if: ${{ env.SUPABASE_SERVICE_KEY != '' }}
        run: |
          APK=$(find android/paxpay/build/outputs/apk/release -name '*.apk' | head -1)
          curl -fsS --http1.1 -X POST \
            "https://tbetcegmszzotrwdtqhi.supabase.co/storage/v1/object/app-releases/paxpay.apk" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK"
          curl -fsS --http1.1 -X POST \
            "https://tbetcegmszzotrwdtqhi.supabase.co/storage/v1/object/app-releases/latest-paxpay.json" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "x-upsert: true" \
            -H "Content-Type: application/json" \
            --data-binary @android/release/latest-paxpay.json
